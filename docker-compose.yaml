services:
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - .env
    volumes:
      - ./backend_db_data:/backend/db_data
      - django_static:/backend/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/backend/staticfiles:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      backend:
          condition: service_healthy
      frontend:
          condition: service_started
    restart: always

volumes:
  django_static:
  backend_db_data:
