[project]
name = "ambulance-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-cors-headers>=4.7.0",
    "django-eventstream>=5.3.2",
    "django-stubs>=5.2.0",
    "djangorestframework>=3.16.0",
    "faker>=37.4.2",
    "mypy>=1.15.0",
    "pydantic>=2.11.3",
    "pyjwt>=2.10.1",
    "ruff>=0.11.8",
    "uvicorn>=0.37.0",
]

[tool.ruff]
extend-exclude = ['/*/tests.py']
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "A", "N"]


[tool.mypy]
python_version = "3.12"
plugins = "mypy_django_plugin.main"

[tool.django-stubs]
django_settings_module = "project.settings"
